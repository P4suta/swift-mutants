included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
  - Fixtures        # the corpus is input, and some of it is broken on purpose

# Generated files say so at the top and disable the length rules for the whole file,
# because their length is the length of what they carry. Listing them here instead would
# not work: the pre-commit hook passes staged files by name, and SwiftLint ignores
# `excluded` when it is given files.
blanket_disable_command:
  allowed_rules:
    - file_length
    - type_body_length

# Formatting is swift-format's job. SwiftLint is here for the rules swift-format has no
# opinion about, so anything purely cosmetic is disabled rather than fought over.
disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - todo
  # We decode tool output with String(decoding:as:), which substitutes U+FFFD for an
  # invalid byte. The rule's preferred failable initialiser returns nil instead, and the
  # call sites would have to turn that into an empty string - losing a compiler diagnostic
  # entirely rather than losing one character of it.
  - optional_data_string_conversion

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - yoda_condition

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error

custom_rules:
  no_japanese_in_source:
    name: "Japanese in source"
    regex: '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}\x{4E00}-\x{9FFF}]'
    message: "The codebase is English-only; Japanese belongs in conversation, not in the repository."
    severity: error
