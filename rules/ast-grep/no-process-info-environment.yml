id: no-process-info-environment
language: swift
severity: error
message: Read the environment through the injected Environment, not ProcessInfo.
note: |
  Two separate reasons, and both are load-bearing.

  In the generated runtime, ProcessInfo.processInfo.environment materialises a whole
  [String: String] from environ on every access. Muter emits exactly that inside each
  guard, so a guard in a hot loop pays a dictionary build per evaluation. The runtime
  reads getenv once into a lazily-initialised global instead.

  Everywhere else, an engine that reaches for the ambient environment cannot be tested
  hermetically and cannot record what a child process actually received.
files:
  - "Sources/**/*.swift"
ignores:
  # The harness and scripted toolchain *are* processes being told what to do,
  # and the only place Swift 6.3 tells the harness its custom scratch path is the environment.
  # Both are test support and never ship.
  - "Sources/SwiftMutantsTestKit/FakeToolchain.swift"
  - "Sources/swift-mutants-fake-toolchain/**"
  # A program has to read its own environment somewhere.
  # `Ambient` is that somewhere, and `AmbientGateTests` asserts it stays the only production doorway.
  - "Sources/SwiftMutantsCLI/Ambient.swift"
rule:
  pattern: ProcessInfo.processInfo.environment
