# Extended diagnostic tiers remain available for explicit investigation.
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_MUTANTS_TEST_KEEP: "1"

jobs:
  sanitizers:
    name: Under a sanitizer
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          experimental: true
      # Sanitizers check concurrent process supervision and cleanup.
      - name: Run sanitizer tests
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: ./scripts/swift-test.sh --sanitize="$SANITIZER" --skip IntegrationTests --skip ToolchainTests
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sanitizer-${{ matrix.sanitizer }}-evidence
          path: ${{ runner.temp }}/swift-mutants-test-*
          if-no-files-found: ignore
          retention-days: 7

  dogfood:
    name: swift-mutants measures swift-mutants
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          experimental: true
      - run: mise run gate:release
      - name: Measure the unit tests
        run: |
          .build-release/release/swift-mutants run \
            --skip RepositoryGateTests --skip IntegrationTests --json > dogfood.json
      # Keep the report without the intentional test failures produced by mutations.
      - name: Keep the report, which is the point of the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dogfood-report
          path: dogfood.json
          if-no-files-found: ignore
          retention-days: 7
