name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A failing test keeps its scratch directory; the job uploads it. A red build should
  # arrive with its evidence attached rather than with a request to reproduce it.
  SWIFT_MUTANTS_TEST_KEEP: "1"

jobs:
  check:
    name: Static analysis and the unit tier
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here needs the token afterwards, and a job that
          # uploads artifacts on failure should not be carrying one.
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          experimental: true
      - name: Report what this machine can do
        run: ./scripts/doctor.sh
      - name: Every gate
        run: mise run check
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: check-evidence
          path: ${{ runner.temp }}/swift-mutants-test-*
          if-no-files-found: ignore

  test-integration:
    name: Integration tier
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here needs the token afterwards, and a job that
          # uploads artifacts on failure should not be carrying one.
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          experimental: true
      - run: mise run test:integration
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: integration-evidence
          path: ${{ runner.temp }}/swift-mutants-test-*
          if-no-files-found: ignore

  gate-release:
    name: The shipped configuration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here needs the token afterwards, and a job that
          # uploads artifacts on failure should not be carrying one.
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          experimental: true
      # The only tier compiled with the optimiser, and the only one that runs the
      # executable this repository ships. Both halves were missing on the day a release
      # binary crashed with every debug test green.
      - run: mise run gate:release
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/swift-mutants-test-*
          if-no-files-found: ignore

  # One check for a branch rule to require, rather than a list the rule has to be
  # kept in step with. A job renamed or added here changes what this waits on; a
  # list in a repository setting changes nothing and goes quietly out of date,
  # which is a gate that stops gating without ever saying so.
  ci-success:
    name: ci-success
    if: always()
    needs: [check, test-integration, gate-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gating job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if jq --exit-status 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "every CI gate passed"
          else
            jq . <<<"$NEEDS"
            exit 1
          fi
