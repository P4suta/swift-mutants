#
# Real packages, at commits that do not move, for explicit investigation.
#
# Fixed revisions make external package failures reproducible.
name: Ecosystem

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.package.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # Revisions match Package.resolved.
        package:
          - name: swift-argument-parser
            repository: apple/swift-argument-parser
            commit: 6a52f3251125d74daf04fcbd5e6f08a75d074382
          - name: swift-system
            repository: apple/swift-system
            commit: 869129b7bf4ecc57b97d0193ad29690ca2134750
          - name: swift-subprocess
            repository: swiftlang/swift-subprocess
            commit: b3937ab85dd32f6e9435914599c1519074769c1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          experimental: true
      - name: Build the tool the way it ships
        run: mise run gate:release
      - name: Fetch the subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ matrix.package.repository }}
          ref: ${{ matrix.package.commit }}
          path: subject
          persist-credentials: false
      - name: Measure it
        run: |
          .build-release/release/swift-mutants run \
            --package-path subject --json > ecosystem.json
      - name: Say what came back
        if: always()
        run: |
          .build-release/release/swift-mutants list --package-path subject | tail -2
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ecosystem-${{ matrix.package.name }}
          path: ecosystem.json
          if-no-files-found: ignore
          retention-days: 7
