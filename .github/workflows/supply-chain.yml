name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          experimental: true
      - name: Known vulnerabilities in resolved dependencies
        run: osv-scanner scan source --recursive .
      - name: Secrets in history
        run: gitleaks detect --no-banner --redact
      - name: Workflow security
        run: zizmor --min-severity medium .github/workflows
