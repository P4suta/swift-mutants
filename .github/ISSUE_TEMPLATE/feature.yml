---

name: Feature request
description: Propose a focused improvement to swift-mutants
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Describe the user problem first.
        Measurement supports macOS SwiftPM packages.
        Xcode projects, Simulator, UI tests, and external local dependencies
        or fixtures are outside the current scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behaviour, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        For a new mutation operator: where it would have caught something real,
        and why its mutants are not equivalent. A rule that mostly produces
        mutants nothing can kill drags a score down and teaches a reader to
        ignore the report.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: >-
        Effects on the public API, CLI options, report schema, or mutation IDs.
        A rule's name and version participate in mutation identity.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
