---

name: Bug report
description: Report a reproducible defect in swift-mutants
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting. Mutation reports, traces and diagnostics carry
        source code and local paths; remove private data before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private source from anything pasted here.
          required: true
  - type: input
    id: version
    attributes:
      label: swift-mutants version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: >-
        Include macOS version, architecture, and what `swift --version` says.
      placeholder: macOS 26.6 arm64; Swift 6.4
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        The command you ran and a minimal public package or source excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: wallclock
    attributes:
      label: If something hung or timed out, what deadline was used?
      description: >-
        Include the CLI `--timeout` value or library `RunOptions.timeout`,
        elapsed wall time, and whether the operation was a build, baseline, or mutant.
      placeholder: "Default timeout; mutant; elapsed 30 seconds"
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: >-
        Include stderr or the library error's stage and diagnostic.
        Remove private data before submitting.
      render: text
